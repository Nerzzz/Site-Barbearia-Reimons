<!-- Teste flatpickr -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
  <div id="calendario"></div>
  <div id="horarios"></div>

  <style>
    .flatpickr-calendar { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
.flatpickr-day.selected { background: #6d28d9; border-color: #6d28d9; }
.flatpickr-day.today { border-color: #6d28d9; }
.flatpickr-day.flatpickr-disabled { color: #ccc; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
  <script>
    // Horários já ocupados (no sistema real, viria do seu backend)
    const ocupados = {
      "2026-11-16": ["09:00", "10:30"],
    };

    function gerarHorarios(inicio = 9, fim = 18, passoMin = 30) {
      const lista = [];
      for (let m = inicio * 60; m < fim * 60; m += passoMin) {
        const h = String(Math.floor(m / 60)).padStart(2, "0");
        const min = String(m % 60).padStart(2, "0");
        lista.push(`${h}:${min}`);
      }
      return lista;
    }

    function mostrarHorarios(dataISO) {
      const container = document.getElementById("horarios");
      const indisponiveis = ocupados[dataISO] || [];
      container.innerHTML = "";

      gerarHorarios().forEach(hora => {
        const btn = document.createElement("button");
        btn.textContent = hora;
        btn.disabled = indisponiveis.includes(hora);
        btn.addEventListener("click", () => {
          alert(`Agendado: ${dataISO} às ${hora}`);
        });
        container.appendChild(btn);
      });
    }

    flatpickr("#calendario", {
      inline: true,
      locale: "pt",
      minDate: "today",
      maxDate: new Date().fp_incr(30), // hoje + 30 dias
      disable: [
        // Ex.: bloquear domingos
        date => date.getDay() === 0
      ],
      onChange: (selectedDates, dataStr) => {
        mostrarHorarios(dataStr); // dataStr no formato YYYY-MM-DD
      }
    });
  </script>
</body>
</html>
